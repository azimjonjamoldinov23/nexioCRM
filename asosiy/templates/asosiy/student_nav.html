<style>
    .student-sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 1000;
        display: flex;
        width: 260px;
        height: 100vh;
        flex-direction: column;
        padding: 24px 16px;
        overflow-y: auto;
        border-right: 1px solid #e5e7eb;
        background: #fff;
        color: #172033;
        font-family: Inter, Arial, sans-serif;
    }
    .student-sidebar a { color: inherit; text-decoration: none; }
    .student-sidebar .student-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 25px;
        margin-bottom: 20px;
        border-bottom: 1px solid #e5e7eb;
    }
    .student-sidebar .student-logo-icon {
        display: grid;
        width: 43px;
        height: 43px;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 7px 18px rgba(37, 99, 235, .25);
        color: #fff;
        font-size: 22px;
        font-weight: 800;
    }
    .student-sidebar .student-logo h2 { margin: 0; font-size: 18px; }
    .student-sidebar .student-logo small {
        display: block;
        margin-top: 2px;
        color: #94a3b8;
        font-size: 10px;
        letter-spacing: 1px;
    }
    .student-sidebar .student-menu-title {
        margin: 18px 0 8px;
        padding: 0 13px;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .5px;
        text-transform: uppercase;
    }
    .student-sidebar .student-nav { display: flex; flex-direction: column; gap: 5px; }
    .student-sidebar .student-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 13px;
        border-radius: 11px;
        color: #64748b;
        font-size: 13px;
        font-weight: 500;
        transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .student-sidebar .student-nav a:hover {
        background: #f1f5f9;
        color: #2563eb;
        transform: translateX(4px);
    }
    .student-sidebar .student-nav a:active {
        transform: scale(0.98);
    }
    .student-sidebar .student-nav a.active {
        background: #2563eb;
        box-shadow: 0 7px 18px rgba(37, 99, 235, .2);
        color: #fff;
    }
    .student-sidebar .student-nav-icon { width: 23px; text-align: center; font-size: 17px; }
    .student-sidebar .student-help {
        margin-top: auto;
        padding: 15px;
        border: 1px solid #dbeafe;
        border-radius: 15px;
        background: #eff6ff;
    }
    .student-sidebar .student-help strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .student-sidebar .student-help p { margin: 0 0 10px; color: #64748b; font-size: 11px; line-height: 1.5; }
    .student-sidebar .student-help a {
        display: block;
        padding: 8px;
        border-radius: 9px;
        background: #2563eb;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
    }
    .page, .container {
        width: min(1280px, calc(100% - 260px));
        margin: 0 0 0 260px;
    }
    @media (max-width: 800px) {
        .student-sidebar {
            position: sticky;
            top: 0;
            width: 100%;
            height: auto;
            padding: 8px 10px;
            border-right: 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .student-sidebar .student-logo,
        .student-sidebar .student-menu-title,
        .student-sidebar .student-help { display: none; }
        .student-sidebar .student-nav { flex-direction: row; gap: 4px; overflow-x: auto; }
        .student-sidebar .student-nav a { flex: 0 0 auto; padding: 10px; }
        .student-sidebar .student-nav-icon { width: auto; }
        .page, .container { width: 100%; margin: 0 auto; }
    }
</style>

<aside class="student-sidebar" aria-label="O‘quvchi navigatsiyasi">
    <a class="student-logo" href="{% url 'index' %}">
        <span class="student-logo-icon">N</span>
        <span><h2>NEXIO</h2><small>EDUCATION CRM</small></span>
    </a>
    <div class="student-menu-title">Asosiy</div>
    <nav class="student-nav">
        <a href="{% url 'index' %}">
            <span class="student-nav-icon">⌂</span><span>Bosh sahifa</span>
        </a>
        <a href="{% url 'profil' %}">
            <span class="student-nav-icon">◉</span><span>Profil</span>
        </a>
        <a href="{% url 'guruhlarim' %}">
            <span class="student-nav-icon">▣</span><span>Guruhlarim</span>
        </a>
        <a href="{% url 'darslarim' %}">
            <span class="student-nav-icon">▤</span><span>Darslarim</span>
        </a>
        <a href="{% url 'davomatim' %}"{% if request.resolver_match.url_name == 'davomatim' %} class="active"{% endif %}>
            <span class="student-nav-icon">✓</span><span>Davomat</span>
        </a>
        <a href="{% url 'reyting' %}"{% if request.resolver_match.url_name == 'reyting' %} class="active"{% endif %}>
            <span class="student-nav-icon">★</span><span>Reytingim</span>
        </a>
        <a href="{% url 'chat' %}"{% if request.resolver_match.url_name == 'chat' %} class="active"{% endif %}>
            <span class="student-nav-icon">☵</span><span>Chat</span>
        </a>
    </nav>
    <div class="student-menu-title">Qo‘shimcha</div>
    <nav class="student-nav">
        <a href="{% url 'tolov' %}"{% if request.resolver_match.url_name == 'tolov' %} class="active"{% endif %}>
            <span class="student-nav-icon">₽</span><span>To‘lovlarim</span>
        </a>
        <a href="#">
            <span class="student-nav-icon">♢</span><span>Bildirishnomalar</span>
        </a>
        <a href="{% url 'profil' %}">
            <span class="student-nav-icon">⚙</span><span>Sozlamalar</span>
        </a>
    </nav>
    <div class="student-help">
        <strong>Yordam kerakmi?</strong>
        <p>Savollaringiz bo‘lsa, administrator bilan bog‘laning.</p>
        <a href="{% url 'chat' %}">Chatga o‘tish</a>
    </div>
</aside>
