services:
  - type: web
    name: nexio-crm
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn sozlamalar.wsgi:application --access-logfile - --error-logfile - --capture-output"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nexio-crm-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: BOT_SERVICE_TOKEN
        sync: false

databases:
  - name: nexio-crm-db
    databaseName: nexio_crm
    user: nexio_crm

