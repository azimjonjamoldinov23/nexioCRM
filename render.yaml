services:
  - type: web
    name: nexio-crm
    env: python
    buildCommand: "./build.sh"
    startCommand: "bash -c 'python manage.py migrate && exec gunicorn sozlamalar.wsgi:application --access-logfile - --error-logfile - --capture-output'"
    disk:
      name: nexio-crm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: BOT_SERVICE_TOKEN
        sync: false

# Mavjud PostgreSQL resursi ma'lumotlarni eksport qilish uchun saqlanadi;
# Nexio web servisi bu bazaga ulanmaydi.
databases:
  - name: nexio-crm-db
    databaseName: nexio_crm
    user: nexio_crm

